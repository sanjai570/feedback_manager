{% extends 'base.html' %}

{% block title %}Delete Event{% endblock %}

{% block content %}
<div class="confirm-container">
    <div class="confirm-card">
        <div class="confirm-icon warning">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <h1>Delete Event</h1>
        <p class="confirm-message">
            Are you sure you want to delete <strong>{{ event.title }}</strong>?
        </p>

        <div class="warning-info">
            <i class="fas fa-info-circle"></i>
            <p>This action will delete the event and all associated feedback. This cannot be undone.</p>
        </div>

        <div class="confirm-actions">
            <form method="POST" class="delete-form">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Yes, Delete Event
                </button>
            </form>
            <a href="{% url 'event_management' %}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </div>
</div>

<style>
    .confirm-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 180px);
        padding: 20px;
        background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
    }

    .confirm-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        padding: 40px;
        text-align: center;
    }

    .confirm-icon {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        margin: 0 auto 25px;
    }

    .confirm-icon.warning {
        background: #fff5e6;
        color: #ff9800;
    }

    .confirm-card h1 {
        font-size: 28px;
        margin: 0 0 15px 0;
        color: #333;
    }

    .confirm-message {
        color: #666;
        margin: 0 0 20px 0;
        font-size: 15px;
        line-height: 1.6;
    }

    .warning-info {
        background: #fff5e6;
        border: 1px solid #ffe0b2;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 25px;
        display: flex;
        gap: 12px;
    }

    .warning-info i {
        color: #ff9800;
        font-size: 18px;
        flex-shrink: 0;
    }

    .warning-info p {
        margin: 0;
        color: #ff6f00;
        font-size: 13px;
        text-align: left;
        line-height: 1.5;
    }

    .confirm-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .delete-form {
        width: 100%;
    }

    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.3s ease;
        width: 100%;
    }

    .btn-danger {
        background: #e74c3c;
        color: white;
    }

    .btn-danger:hover {
        background: #c0392b;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
    }

    .btn-secondary {
        background: white;
        color: #333;
        border: 2px solid #ddd;
    }

    .btn-secondary:hover {
        border-color: #667eea;
        color: #667eea;
    }
</style>
{% endblock %}
